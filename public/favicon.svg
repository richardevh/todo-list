<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-opacity="0.25" />

  <!-- Card Sheet -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="48" fill="#ffffff" />
    
    <!-- Top task row with check -->
    <rect x="144" y="152" width="44" height="44" rx="12" fill="url(#checkGrad)" />
    <path d="M154 174 L163 183 L178 165" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="210" y="166" width="158" height="16" rx="8" fill="#0f766e" />

    <!-- Middle task row with check -->
    <rect x="144" y="234" width="44" height="44" rx="12" fill="url(#checkGrad)" />
    <path d="M154 256 L163 265 L178 247" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="210" y="248" width="128" height="16" rx="8" fill="#0f766e" />

    <!-- Bottom task row -->
    <rect x="144" y="316" width="44" height="44" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4" />
    <rect x="210" y="330" width="100" height="16" rx="8" fill="#94a3b8" />
  </g>
</svg>